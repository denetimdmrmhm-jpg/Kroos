name: KROS Camera OCR APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Diagnose runner and project
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls -la
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/kros/tartim/MainActivity.java
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDK_BIN=""
          for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin "$ANDROID_HOME"/cmdline-tools/latest/bin "$ANDROID_HOME"/tools/bin; do
            if [ -x "$candidate/sdkmanager" ]; then
              SDK_BIN="$candidate"
              break
            fi
          done
          if [ -z "$SDK_BIN" ]; then
            echo "::notice::Preinstalled sdkmanager missing; bootstrapping official Android command-line tools"
            curl --fail --location --retry 3 --silent --show-error \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              --output "${RUNNER_TEMP}/android-cmdline-tools.zip"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q "${RUNNER_TEMP}/android-cmdline-tools.zip" -d "${RUNNER_TEMP}/android-cmdline-tools"
            cp -R "${RUNNER_TEMP}/android-cmdline-tools/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            SDK_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
            test -x "$SDK_BIN/sdkmanager"
          fi
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          "$SDK_BIN/sdkmanager" --version
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euxo pipefail
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$license_status" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed (sdkmanager exit $license_status)"
            exit "$license_status"
          fi
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Diagnose Gradle
        run: gradle --version
      - name: Build APK with diagnostic output
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee build.log
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KROS-Kamera-OCR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Print failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::group::Android SDK diagnostics"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          command -v sdkmanager || true
          find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -maxdepth 4 -name sdkmanager -print 2>/dev/null || true
          echo "::endgroup::"
          if [ -f build.log ]; then
            echo "::group::Last 100 build log lines"
            tail -n 100 build.log
            echo "::endgroup::"
          fi
      - name: Upload diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KROS-Derleme-Hata-Kaydi
          path: build.log
          if-no-files-found: ignore
