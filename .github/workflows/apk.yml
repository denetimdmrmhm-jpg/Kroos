name: KROS Camera OCR APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source tree
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/kros/tartim/MainActivity.java
      - name: Prepare Android SDK command line tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER=""
          for f in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager "$ANDROID_HOME"/tools/bin/sdkmanager; do
            if [ -x "$f" ]; then SDKMANAGER="$f"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            curl --fail --location --retry 3 --silent --show-error \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o "$RUNNER_TEMP/android-tools.zip"
            mkdir -p "$RUNNER_TEMP/android-tools" "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
            cp -R "$RUNNER_TEMP/android-tools/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' '8933bad161af4178b1185d1a37fbf41ea5269c55' 'd56f5187479451eabf01fb78af6dfcb131a6481e' > "$ANDROID_HOME/licenses/android-sdk-license"
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Clean and rebuild debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain clean assembleDebug 2>&1 | tee build.log
      - name: Validate debug APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: KROS-Kamera-OCR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Print diagnostics if failed
        if: failure()
        shell: bash
        run: |
          echo "::group::Environment"
          java -version || true
          gradle --version || true
          command -v sdkmanager || true
          ls -la "$ANDROID_HOME/platforms" || true
          echo "::endgroup::"
          if [ -f build.log ]; then
            echo "::group::Gradle failure detail"
            tail -n 180 build.log
            echo "::endgroup::"
          fi
      - name: Publish failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KROS-Derleme-Hata-Kaydi
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
